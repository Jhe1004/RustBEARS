name: Three-platform native and frontend checks
on:
  push:
    branches: [main, master, v1.2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  python:
    name: Rust and Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 14 was retired in November 2026; macos-15 is arm64.
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify source mirror
        run: python scripts/sync_r_sources.py --check
      - name: Rust unit tests
        working-directory: rust
        run: cargo --config 'source.crates-io.replace-with="vendored-sources"' --config 'source.vendored-sources.directory="vendor"' test --locked --offline
      - name: Build and install platform wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy scipy pandas matplotlib threadpoolctl pytest
          python -m pip wheel --no-build-isolation --no-deps -w dist .
          python -m pip install --no-deps dist/rustbears-*.whl
      - name: Test installed package outside checkout
        run: python scripts/test_installed_package.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-${{ matrix.os }}
          path: |
            dist/*.whl
            evidence/ci-python.xml
  r:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Enable Windows GNU ABI
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r_package/RustBEARS
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            any::devtools
            any::remotes
            nmatzke/rexpokit@bfc071ec6d2235a906bbeee122f711f6fea1b78b
            nmatzke/cladoRcpp@bc5198f075f135eb68913cf987a2f5169021c7ce
            any::FD
            any::snow
            any::minqa
            any::gdata
            any::phylobase
      - name: Install pinned independent legacy oracle
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Its retained example data load devtools during installation, though
          # upstream does not declare that loader dependency. Install it first
          # in the preceding step, then the unmodified pinned upstream package.
          stopifnot(requireNamespace('devtools', quietly=TRUE))
          remotes::install_github('nmatzke/BioGeoBEARS@876a48c4b3d6ada678e4de4d130b5b3bafea2b2c',
                                  dependencies=FALSE, upgrade='never', build_vignettes=FALSE)
          stopifnot(identical(packageDescription('BioGeoBEARS')$RemoteSha,
                              '876a48c4b3d6ada678e4de4d130b5b3bafea2b2c'))
      - name: Synchronize and verify native source
        run: |
          python scripts/sync_r_sources.py --manifest evidence/r-rust-mirror.json
          python -c "from pathlib import Path; assert Path('scripts/legacy_trait_oracle.R').read_bytes() == Path('r_package/RustBEARS/inst/validation/legacy_trait_oracle.R').read_bytes()"
      - name: Install and exercise both R engines
        run: |
          R CMD INSTALL r_package/RustBEARS
          Rscript -e 'testthat::test_file("r_package/RustBEARS/tests/testthat/test-noninteractive-viewers.R", stop_on_failure=TRUE)'
          Rscript tests/test_r_edge_contracts.R
          Rscript tests/test_r_optimizer.R
          Rscript tests/test_r_v12_contracts.R
          Rscript tests/test_r_v12_statistics.R
          Rscript tests/test_r_v12_summaries.R
      - name: Check R source package
        shell: Rscript {0}
        run: |
          dir.create('evidence', showWarnings=FALSE)
          checked <- rcmdcheck::rcmdcheck('r_package/RustBEARS', args=c('--no-manual'), error_on='warning', check_dir='evidence/Rcheck')
          saveRDS(checked, 'evidence/r-check-result.rds')
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r-${{ matrix.os }}
          path: evidence/
